name: Deploy dev

# Deploys `main` to the dev VM after CI is green (ADR 0016). Local debugging and
# QC stay on the developer's machine; this runs only once a change is merged.
#
# Why these triggers: the deploy job runs on a self-hosted runner that lives ON
# the dev VM, so it must never execute code from a pull request. It starts only
# from a successful CI run of a push to `main`, or from a manual dispatch on
# `main`. Never add `pull_request` or `pull_request_target` here.
#
# Rollback / redeploy: run this workflow manually with `tag` = `sha-<commit>`
# (no build, just deploy that image).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to deploy without building (e.g. sha-0123abc...). Empty = build and deploy this commit.
        required: false
        default: ''

# One deploy at a time; a newer one waits instead of cutting a running one off.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      tag: ${{ steps.p.outputs.tag }}
      image: ${{ steps.p.outputs.image }}
      tools_image: ${{ steps.p.outputs.tools_image }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - id: p
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha="${RUN_SHA:-$GITHUB_SHA}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "$INPUT_TAG" ]; then
            # Validated before it reaches $GITHUB_OUTPUT or any shell line: a
            # newline or a quote in a dispatch input must not inject anything.
            [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "invalid tag" >&2; exit 1; }
            tag="$INPUT_TAG"; build=false
          else
            tag="sha-$sha"; build=true
          fi
          {
            echo "sha=$sha"
            echo "tag=$tag"
            echo "build=$build"
            echo "image=ghcr.io/$owner/chuyennhahung-app"
            echo "tools_image=ghcr.io/$owner/chuyennhahung-tools"
          } >> "$GITHUB_OUTPUT"

  # Built on GitHub's runner: `next build` does not fit the 1.9 GB VM.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # NEXT_PUBLIC_SITE_URL is baked into the bundle, so this image is the DEV
      # image. Prod needs its own build with its own URL.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.DEV_SITE_URL || 'http://192.168.100.140' }}
          tags: |
            ${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.tag }}
            ${{ needs.plan.outputs.image }}:dev
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      # The one-off scripts image (`npm run content:seed-places`, `admin:create`, ...).
      # Built here because its `builder` stage runs `next build`, which does not fit
      # the VM. Never started by the deploy: it is only pulled by hand when a script
      # is needed (docs/deploy-operations.md). Same DEV URL baked in as above.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: tools
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.DEV_SITE_URL || 'http://192.168.100.140' }}
          tags: |
            ${{ needs.plan.outputs.tools_image }}:${{ needs.plan.outputs.tag }}
            ${{ needs.plan.outputs.tools_image }}:dev
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, linux, cnh-dev]
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      # The compose files of the commit being deployed come from this checkout.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The workspace persists on the VM between jobs: keep no token in it.
          persist-credentials: false
      - name: deploy
        env:
          APP_IMAGE: ${{ needs.plan.outputs.image }}
          DEPLOY_TAG: ${{ needs.plan.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Values reach the shell as environment variables, never interpolated.
        run: bash deploy/deploy.sh "$DEPLOY_TAG"
