# Proxy headers for the app behind the stack's nginx. Usage: docs/usage.md →
# Deploy. Merge into the existing `location /` that proxies to app:3000 —
# keep the stack's own 503 maintenance handling.
#
# The app keys its rate limiter on the first X-Forwarded-For hop and, with
# TRUST_PROXY_HEADERS=true, takes the browser's scheme from X-Forwarded-Proto.
# Both must therefore be OVERWRITTEN here, never appended to: a client-supplied
# value would otherwise pick its own rate-limit bucket.

location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $remote_addr, not $proxy_add_x_forwarded_for (which appends).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;

    # The largest API body the app accepts is far below this.
    client_max_body_size 2m;
}
