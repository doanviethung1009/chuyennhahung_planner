# Overlay (OPTIONAL, OFF by default): QC/DBA access to the stack's PostgreSQL
# directly over the LAN — "Option B". Runbook: docs/deploy-db-access.md.
#
# Publishes the database on the VM's LAN address ONLY: ${DB_BIND_ADDR}:15432
# -> 5432. Never 0.0.0.0, never the router, never Cloudflare Tunnel. Set
# DB_BIND_ADDR in the stack's .env to the VM's LAN IP (no address is baked in;
# unset, Compose refuses to start). Never set it to 0.0.0.0. Only for the local-db layout.
#
# SECURITY: Docker publishes ports through iptables chains that bypass `ufw`.
# Restrict who may connect in the DOCKER-USER chain (and/or the Proxmox
# firewall) BEFORE enabling this — see the runbook, section H.
#
# Use it INSTEAD of compose.postgres-ssh.yml, never together: Compose appends
# `ports` lists, so both files would publish both bindings.
#
#   cd /opt/chuyennhahung/src/deploy
#   docker compose --project-directory . --env-file /opt/chuyennhahung/.env \
#     --profile local-db -f compose.yml -f compose.app.yml -f compose.app.bind.yml \
#     -f compose.app.local-db.yml -f compose.postgres-lan.yml \
#     up -d --no-deps postgres
#
# `backend` is `internal: true` and cannot publish ports, so postgres also joins
# the non-internal `dbaccess` network. `app` stays on `backend` only.
# deploy/deploy.sh does not use this file and only ever recreates `app`
# (--no-deps), so a deploy neither adds nor removes this port mapping.

services:
  postgres:
    ports:
      - "${DB_BIND_ADDR:?set DB_BIND_ADDR in .env to the VM LAN IP}:15432:5432"
    networks:
      - backend
      - dbaccess

networks:
  dbaccess: {}
