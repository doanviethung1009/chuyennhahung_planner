# nginx for the self-hosted stack (deploy/compose.yml). Plain HTTP on :80 —
# fine on a LAN; put TLS in front (certbot or a load balancer) before real users
# sign in, then set NEXT_PUBLIC_SITE_URL to the https origin and rebuild.

# Resolve `app` per request so nginx starts, and shows the maintenance page,
# while the app container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

# Behind another proxy / load balancer, $remote_addr is that proxy: add
#   set_real_ip_from <proxy-ip>; real_ip_header X-Forwarded-For;
# BEFORE relying on the rate limiter.

server {
    listen 80 default_server;
    server_name _;

    # The largest API body the app accepts is far below this.
    client_max_body_size 2m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 502 503 504 /maintenance.html;

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # OVERWRITE, never append — the app keys its rate limiter on the first
        # X-Forwarded-For hop and trusts X-Forwarded-Proto (TRUST_PROXY_HEADERS).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
