# nginx for the self-hosted stack (deploy/compose.yml). Plain HTTP on :80 —
# fine on a LAN; put TLS in front (certbot or a load balancer) before real users
# sign in, then set NEXT_PUBLIC_SITE_URL to the https origin and rebuild.

# Resolve `app` per request so nginx starts, and shows the maintenance page,
# while the app container is not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;

# --- Logging policy (docs/deploy-operations.md → Logs) -----------------------
# The default `combined` format writes $request (path AND query string), the
# Referer and the user agent. Share tokens travel in the path and the Google
# OAuth callback carries `code`/`state` in the query, so this format logs only
# the normalised path ($uri, no query) with token paths masked, and never any
# header that carries a credential (Cookie, Authorization). Retention (access
# 14 days, error 30 days) is deploy/logrotate/chuyennhahung.
map $uri $log_uri {
    ~^/(?<area>chia-se|en/shared|api/shared)/ /$area/[redacted];
    default $uri;
}
log_format cnh '$remote_addr [$time_local] "$request_method $log_uri" '
               '$status $body_bytes_sent $request_time';
access_log /var/log/nginx/access.log cnh;
# nginx writes the raw request line (with its query) into error-log entries it
# cannot suppress; `warn` keeps those rare. Treat error.log as sensitive.
error_log /var/log/nginx/error.log warn;

# Per-client request rate. Generous on purpose: one NAT address may be a whole
# office. The app has its own limiter (in process memory) for sign-in and writes.
limit_req_zone $binary_remote_addr zone=cnh_req:10m rate=20r/s;
limit_req_status 429;

# Behind another proxy / load balancer, $remote_addr is that proxy: add
#   set_real_ip_from <proxy-ip>; real_ip_header X-Forwarded-For;
# BEFORE relying on the rate limiter.

server {
    listen 80 default_server;
    server_name _;

    # The largest API body the app accepts is far below this.
    client_max_body_size 2m;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 502 503 504 /maintenance.html;

    location / {
        set $upstream http://app:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;

        # OVERWRITE, never append — the app keys its rate limiter on the first
        # X-Forwarded-For hop and trusts X-Forwarded-Proto (TRUST_PROXY_HEADERS).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        limit_req zone=cnh_req burst=60 nodelay;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
